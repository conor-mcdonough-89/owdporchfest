<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="logoTitle">
  <title id="logoTitle">OWD Porchfest logo: a front porch with a guitar</title>
  <g fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- roof -->
    <path d="M14 54 L60 20 L106 54" />
    <!-- roof eaves -->
    <path d="M18 54 L102 54" />
    <!-- porch posts -->
    <path d="M26 54 L26 98" />
    <path d="M94 54 L94 98" />
    <!-- porch floor -->
    <path d="M14 98 L106 98" />
    <!-- door -->
    <path d="M52 98 L52 70 L68 70 L68 98" />
    <circle cx="64" cy="84" r="1.5" fill="currentColor" />
    <!-- window hint -->
    <path d="M36 66 L44 66" />
    <path d="M76 66 L84 66" />
    <!-- bunting -->
    <path d="M20 46 Q40 58 60 46 Q80 58 100 46" stroke-dasharray="1 0" />
    <!-- guitar body -->
    <ellipse cx="40" cy="86" rx="9" ry="11" transform="rotate(-20 40 86)" />
    <circle cx="39" cy="85" r="2.4" transform="rotate(-20 40 86)" />
    <!-- guitar neck -->
    <path d="M46 78 L68 56" />
    <path d="M68 56 L72 52" />
    <!-- little music note -->
    <path d="M86 74 L86 62 L94 60 L94 70" />
    <circle cx="84" cy="74" r="2.2" fill="currentColor" stroke="none" />
    <circle cx="92" cy="70" r="2.2" fill="currentColor" stroke="none" />
  </g>
</svg>
